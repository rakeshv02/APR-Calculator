<body style="margin:0;background:#f8faff;font-family:'Segoe UI',Arial,sans-serif">
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState } = React;
function fmt(n){return '$'+Math.round(n).toLocaleString();}

function calcAPR(principal, annualRate, termMonths, fees) {
  const r = annualRate / 100 / 12;
  const n = termMonths;
  const monthlyPayment = r > 0 ? principal * r * Math.pow(1+r,n) / (Math.pow(1+r,n)-1) : principal/n;
  const totalPaid = monthlyPayment * n;
  const totalInterest = totalPaid - principal;

  // APR: solve for rate where PV of payments = principal - fees
  const netPrincipal = principal - fees;
  let lo = 0, hi = 1, aprMonthly = r;
  for (let i = 0; i < 100; i++) {
    const mid = (lo + hi) / 2;
    const pv = mid > 0 ? monthlyPayment * (1 - Math.pow(1+mid,-n)) / mid : monthlyPayment * n;
    if (pv > netPrincipal) lo = mid; else hi = mid;
    aprMonthly = mid;
  }
  const apr = aprMonthly * 12 * 100;
  return { monthlyPayment, totalPaid, totalInterest, apr };
}

function App() {
  const [principal, setPrincipal] = useState(20000);
  const [rate, setRate] = useState(6.5);
  const [term, setTerm] = useState(60);
  const [fees, setFees] = useState(500);

  const r = calcAPR(Number(principal)||0, Number(rate)||0, Number(term)||1, Number(fees)||0);

  return (
    <div style={{maxWidth:520,margin:'0 auto',paddingBottom:40}}>
      <div style={{background:'#1a1a2e',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <a href="https://tabutility.com" style={{color:'#a5b4fc',textDecoration:'none',fontSize:14}}>← All Tools</a>
        <span style={{color:'#fff',fontWeight:700,fontSize:15}}>⚡ Tabutility</span>
      </div>
      <div style={{background:'linear-gradient(135deg,#b45309,#92400e)',padding:'28px 20px',textAlign:'center',color:'#fff'}}>
        <div style={{fontSize:36,marginBottom:8}}>🏦</div>
        <h1 style={{margin:'0 0 6px',fontSize:22,fontWeight:900}}>APR Calculator</h1>
        <p style={{margin:0,fontSize:13,opacity:0.85}}>True Annual Percentage Rate including fees</p>
      </div>
      <div style={{padding:20}}>
        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          {[
            ['Loan Amount','$',principal,setPrincipal,'number'],
            ['Nominal Interest Rate','%',rate,setRate,'number'],
            ['Loan Term (months)','mo',term,setTerm,'number'],
            ['Total Fees & Charges','$',fees,setFees,'number'],
          ].map(([label,prefix,val,setter])=>(
            <div key={label} style={{marginBottom:14}}>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>{label}</label>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280',fontSize:13}}>{prefix}</span>
                <input type="number" value={val} onChange={e=>setter(e.target.value)}
                  style={{width:'100%',padding:`11px 12px 11px ${prefix.length>1?'36px':'28px'}`,borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
              </div>
            </div>
          ))}
        </div>

        <div style={{background:'linear-gradient(135deg,#fef3c7,#fde68a)',borderRadius:14,padding:24,textAlign:'center',marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:'#92400e',marginBottom:4}}>TRUE APR (with fees)</div>
          <div style={{fontSize:52,fontWeight:900,color:'#b45309'}}>{r.apr.toFixed(2)}%</div>
          <div style={{fontSize:14,color:'#92400e',marginTop:4}}>vs {rate}% nominal rate</div>
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
          {[
            ['Monthly Payment', fmt(r.monthlyPayment)],
            ['Total Repaid', fmt(r.totalPaid)],
            ['Total Interest Paid', fmt(r.totalInterest)],
            ['Total Fees', fmt(Number(fees)||0)],
            ['Total Cost (interest + fees)', fmt(r.totalInterest + (Number(fees)||0))],
            ['Nominal Rate', (Number(rate)||0).toFixed(2)+'%'],
            ['True APR', r.apr.toFixed(2)+'%'],
          ].map(([l,v])=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid #f0f0f0',fontSize:14}}>
              <span style={{color:'#6b7280'}}>{l}</span><strong>{v}</strong>
            </div>
          ))}
        </div>
        <div style={{background:'#fef3c7',borderRadius:12,padding:16,marginTop:16,fontSize:13,color:'#92400e',lineHeight:1.6}}>
          <strong>APR</strong> is the true annual cost of a loan including fees. Lenders must disclose it by law in the US (TILA), UK (Consumer Credit Act), and EU. Always compare APR — not just the interest rate.
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
//]]>
</script>
</body>
